<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarunraj Kalyanasundaram — Portfolio</title>
  <meta name="description" content="Personal portfolio of Tarunraj Kalyanasundaram — bridging the gap between software, physics, and low-level systems.">
  <meta name="theme-color" content="#010005">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <canvas id="galaxy-canvas" aria-hidden="true"></canvas>

  <div class="nebula nebula-1" aria-hidden="true"></div>
  <div class="nebula nebula-2" aria-hidden="true"></div>

  <header id="identity-card">
    <h1 id="identity-name"></h1>
    <p id="identity-title"></p>
    <p id="identity-tagline"></p>
    <div class="social-links">
      <a href="https://github.com" target="_blank" aria-label="GitHub"><svg width="18" height="18" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path
            d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22">
          </path>
        </svg></a>
      <a href="https://linkedin.com" target="_blank" aria-label="LinkedIn"><svg width="18" height="18"
          viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
          <rect x="2" y="9" width="4" height="12"></rect>
          <circle cx="4" cy="4" r="2"></circle>
        </svg></a>
      <a href="mailto:hello@alexchen.dev" aria-label="Email"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
          <polyline points="22,6 12,13 2,6"></polyline>
        </svg></a>
    </div>
  </header>

  <div id="galaxy-container">
    <div id="black-hole-target" role="button" tabindex="0" aria-label="About me">
      <span class="bh-hint">about me</span>
    </div>
  </div>

  <!-- Nodes layer — fixed, above sections, for flying node dots -->
  <div id="nodes-layer" aria-hidden="true"></div>

  <!-- Hero spacer — creates scroll space for the initial galaxy view -->
  <div id="hero-spacer"></div>

  <div id="scroll-prompt">
    <div class="mouse-icon"><div class="mouse-wheel"></div></div>
    <span>Scroll to Explore</span>
  </div>

  <!-- Sections populated by JS -->
  <main id="sections-container"></main>

  <footer id="site-footer">
    <span>&copy; 2026 Tarunraj Kalyanasundaram</span>
  </footer>

  <script type="module" src="js/app.js?v=2"></script>
</body>

</html>
